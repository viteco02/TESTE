  // F4 · TOP 5
  if(t>=FT[3]-0.3) withGroup(t,3,FC[3].x,FC[3].y,()=>{ const t0=FT[3];
    const d=OM.wordRise(t,t0-0.16,{dist:60}); word('t5','TOP 5 NOTÍCIAS',-520,-250+d.y,{...BCI8,size:84,color:'#fff',align:'left'},()=>({op:d.op}));
    for(let i=0;i<3;i++){ const x=-520+i*360; const dd=OM.letterDrop(t,t0-0.06,i,{stagger:0.08,dist:200,zeta:0.48,omega:20});
      word('tn'+i,String(i+1),x,150+dd.y,{...BCI9,size:360,color:NV.y,align:'left'},()=>({op:dd.op,sy:dd.sy,sx:dd.sx,base:true}));
      ctx.save(); ctx.globalAlpha*=dd.op; ctx.fillStyle=NV.ice; rr(x+120,20+dd.y,200,22,11); ctx.fill(); ctx.globalAlpha*=0.5; rr(x+120,64+dd.y,150,22,11); ctx.fill(); ctx.restore(); } });
  // F5 · SAIU AGORA card
  if(t>=FT[4]-0.3) withGroup(t,4,FC[4].x,FC[4].y,()=>{ const t0=FT[4]; const d=OM.popIn(t,t0-0.15,{rise:120,s0:0.88,ds:0.12,zeta:0.58});
    ctx.save(); ctx.translate(0,d.dy); ctx.rotate(-0.04*(1-d.k)+0.02); ctx.scale(d.s,d.s); ctx.globalAlpha*=d.op;
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=70; ctx.shadowOffsetY=30; ctx.fillStyle=NV.ice; rr(-420,-330,840,660,22); ctx.fill(); ctx.shadowColor='transparent';
    ctx.save(); rr(-420,-330,840,330,22); ctx.clip(); ctx.fillStyle=NV.navy; ctx.fillRect(-420,-330,840,330);
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=18; for(let x=-900;x<600;x+=56){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+160,-340); ctx.stroke(); }
    blade(60,-150,520,90,-0.21,NV.y,1); ctx.fillStyle=NV.navy; ctx.font=`italic 900 74px 'Barlow Condensed'`; ctx.textAlign='center'; ctx.fillText('VERDADE E DESAFIO',60,-124); ctx.restore();
    const tg=OM.popIn(t,t0+0.12,{rise:20,s0:0.6,ds:0.4,zeta:0.5}); ctx.save(); ctx.translate(-300,-330); ctx.scale(tg.s,tg.s); ctx.globalAlpha*=tg.op; ctx.fillStyle=NV.navy; rr(-90,-34,250,68,34); ctx.fill();
    ctx.fillStyle=NV.y; ctx.font=`700 40px 'Barlow Condensed'`; ctx.textAlign='left'; ctx.fillText('SAIU AGORA',-62,14); ctx.restore();
    ctx.fillStyle=NV.navy; ctx.font=`italic 800 66px 'Barlow Condensed'`; ctx.textAlign='left'; ctx.fillText('SEMANA DE ORAÇÃO JOVEM',-380,90);
    ctx.fillStyle=NV.mute; ctx.font=`400 38px 'Barlow'`; ctx.fillText('Pega pronto, adapta e usa',-380,160); ctx.fillText('no próximo sábado.',-380,206);
    track('c1',-420,-330); track('c2',420,330); ctx.restore(); });
  // F6 · doação
  if(t>=FT[5]-0.3) withGroup(t,5,FC[5].x,FC[5].y,()=>{ const t0=FT[5];
    const d=OM.wordRise(t,t0-0.18,{dist:60}); word('mjc','SEU MINISTÉRIO JOVEM NO CASA',0,-170+d.y,{...BC7,size:62,color:NV.ice,ls:0.06},()=>({op:d.op}));
    const k=E.expoOut(seg(t,t0-0.05,t0+0.3)); const th=spring(t-t0-0.08,0.5,20);
    blade(lerp(1600,0,k),40,980,lerp(30,190,clamp(th,0,1.4)),-0.21,NV.y,1,'don');
    word('doa','FAÇA SUA DOAÇÃO',lerp(1600,0,k),78,{...BCI9,size:118,color:NV.navy},(i)=>{ const dd=OM.letterDrop(t,t0+0.12,i,{stagger:0.025,dist:60}); return {dy:dd.y,op:dd.op}; }); });

  // ── climax: logo assembles where everything gathered; hold; countdown takes it apart
  if(t>=C.climax+0.15 && t<C.quase+0.3){
    const LWw=3700, LHw=LWw*LH/LW, pxs=LW/LWw;  // world→logo pixels
    const hs=spring(t-44.84,0.5,15), him=OM.impact(t,45.02,{decay:6,omega:20,sqx:0.10,sqy:0.14});
    const wsI=spring(t-45.18,0.72,14), wv=Math.abs(OM.springVel? 0:0);
    const st={ house:{op:clamp((t-44.84)*12,0,1),dy:(1-hs)*-2600*pxs,sx:him.sx,sy:him.sy},
      word:{op:clamp((t-45.18)*10,0,1),dx:(1-wsI)*3200*pxs,sx:1+(1-wsI)*0.25},
      arc:{op:1,reveal:E.expoOut(seg(t,45.5,46.1)),from:0},
      sheen:seg(t,48.2,49.3) };
    // countdown removes pieces
    const c0=E.cubicInOut(seg(t,C.count[0]+0.12,C.count[0]+0.6)); if(c0>0){ st.arc.from=c0; }
    const c1=E.expoInOut(seg(t,C.count[1]+0.1,C.count[1]+0.55)); if(c1>0){ st.word.dx+=c1*1600; st.word.op*=1-ssstep(0.5,1,c1); }
    const c2=E.expoInOut(seg(t,C.count[2]+0.1,C.count[2]+0.6)); if(c2>0){ st.house.dy+=-c2*1400; st.house.op*=1-ssstep(0.5,1,c2); }
    drawLogoPieces(st); placeLogo('LG',G.x,G.y,LWw,1);
    // NOVA IDENTIDADE blade under the logo
    const nb=E.expoOut(seg(t,46.15,46.5)), nbo=E.expoInOut(seg(t,C.fadeDown,C.fadeDown+0.5));
    if(nb>0 && nbo<1){ const bx=lerp(-5000,0,nb)+nbo*-5200; const by=G.y+LHw/2+420; const th=spring(t-46.3,0.5,18);
      blade(bx,by,2500,lerp(60,330,clamp(th,0,1.4)),-0.21,NV.y,1,'nid');
      word('nid','NOVA IDENTIDADE',bx,by+110,{...BCI9,size:300,color:NV.navy,ls:0.01},(i)=>{ const d=OM.letterDrop(t,46.4,i,{stagger:0.03,dist:160}); return {dy:d.y,op:d.op}; }); }
    // countdown numerals
    C.count.forEach((tc,i)=>{ const nx=i<2?C.count[i+1]:C.quase-0.2; if(!vis(t,tc-0.02,nx+0.5)) return;
      const out=E.expoInOut(seg(t,nx,nx+0.42)); const s=['03','02','01'][i];
      word('cd'+i,s,G.x+out*-6000,G.y-1500,{...BCI9,size:1700,color:NV.y,ls:-0.02},(j)=>{ const d=OM.letterDrop(t,tc,j,{stagger:0.05,dist:900,zeta:0.5,omega:22,squash:0.0012}); return {dy:d.y,op:d.op,sx:d.sx,sy:d.sy,base:true}; }); });
  }
  // ── QUASE. / AINDA NÃO. / EM BREVE. / end
  if(t>=C.quase-0.1){
    const fall=E.cubicInOut(seg(t,C.ainda+0.12,C.ainda+0.7));
    if(t<C.ainda+0.8){ ctx.save(); ctx.translate(0,fall*1600); ctx.rotate(fall*0.12);
      word('qu','QUASE.',Q.x,Q.y+110,{...BCI9,size:330,color:'#fff'},(i)=>{ const d=OM.letterDrop(t,C.quase,i,{stagger:0.045,dist:260,zeta:0.48,omega:22,squash:0.004}); return {dy:d.y,op:d.op,sx:d.sx,sy:d.sy,base:true}; });
      const sl=E.expoOut(seg(t,C.ainda-0.04,C.ainda+0.12)); if(sl>0) blade(lerp(-1600,0,sl),Q.y,1100*(1+0.5*(1-sl)),46,-0.21,NV.y,1,'qs');
      ctx.restore(); }
    if(vis(t,C.ainda+0.1,C.embreve+0.5)){ const up=E.expoInOut(seg(t,C.embreve-0.05,C.embreve+0.35));
      word('an','AINDA NÃO.',Q.x,Q.y+90,{...BCI9,size:250,color:'#fff'},(i,n)=>{ const d=OM.letterDrop(t,C.ainda+0.2,i,{stagger:0.035,dist:-300,zeta:0.5,omega:22,squash:0.004});
        const u=E.expoInOut(seg(t,C.embreve-0.05+i*0.02,C.embreve+0.3+i*0.02)); return {dy:d.y-u*1200,op:d.op*(1-u),sx:d.sx,sy:d.sy,base:true}; }); }
    if(t>=C.embreve){ const fk=E.expoInOut(seg(t,C.final,C.final+0.7)); const es0=fitSize('EM BREVE.',BCI9,900,300); const ey=lerp(Q.y+120,Q.y+340,fk), es=lerp(es0,150,fk);
      // the blade grows under EM BREVE at the end
      const bk=spring(t-C.final-0.35,0.55,16); if(t>=C.final+0.3) blade(Q.x,ey-es*0.36,lerp(40,760,clamp(bk,0,1.2)),es*1.05,-0.21,NV.y,1,'eb');
      ctx.save(); ctx.beginPath(); ctx.rect(Q.x-2000,ey-3000,4000,3000+es*0.08+(t<C.final?0:4000)); ctx.clip();
      word('em','EM BREVE.',Q.x,ey,{...BCI9,size:es,color:fk>0.6?NV.navy:NV.y,ls:0.01},(i)=>{ const m=OM.maskRise(t,C.embreve+0.05,i,{stagger:0.04,zeta:0.55,omega:18,dist:es*1.1}); return {dy:m.y,op:m.visible?1:0}; });
      ctx.restore();
      if(t>=C.final){ const lk=spring(t-C.final-0.25,0.62,14); drawLogoPieces({house:{op:1},word:{op:1},arc:{op:1,reveal:E.expoOut(seg(t,C.final+0.45,C.final+1.1))}});
        placeLogo('LF',Q.x,Q.y-170+(1-lk)*120,940*lerp(0.92,1,lk),clamp((t-C.final-0.25)*5,0,1)); } }
  }
}

// ═══════════════════ frame ═══════════════════
function draw(t){
  TR=new Map(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const useA=t<37.25, useB=t>=36.0;
  const camA=camOf(t,KA,HITS_A), camB=camOf(t,KB,HITS_B);
  if(useB){ groundB(camB,t); worldB(t,camB); }
  if(useA){
    const parting=t>=C.part;
    if(!parting){ groundA(camA,t); worldA(t,camA); }
    else { // render world A offscreen, then draw it as two plates splitting along the crack
      const main=ctx; const octx=oc.getContext('2d'); octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,W,H);
      // temporarily draw into the offscreen canvas
      ctx=octx; groundA(camA,t); worldA(t,camA); ctx=main;
      const M=OM.view(camA,{W,H}); const sp=CRACK.map(([x,y])=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]]);
      const k=E.quintInOut(seg(t,C.part,37.05)); const apex=sp[Math.floor(sp.length/2)];
      const plates=[{dir:-1,dy:-k*1500,rot:-0.10*k,dx:-k*120},{dir:1,dy:k*1500,rot:0.08*k,dx:k*90}];
      // glow in the gap
      if(k>0){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=Math.min(1,k*3)*(1-k); ctx.strokeStyle=NV.teal; ctx.shadowColor=NV.teal; ctx.shadowBlur=60; ctx.lineWidth=40*k+6;
        ctx.beginPath(); sp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); }
      for(const pl of plates){ ctx.save(); ctx.setTransform(1,0,0,1,0,0);
        ctx.translate(apex[0]+pl.dx,apex[1]+pl.dy); ctx.rotate(pl.rot); ctx.translate(-apex[0],-apex[1]);
        ctx.beginPath(); ctx.moveTo(-3000,sp[0][1]); sp.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.lineTo(W+3000,sp[sp.length-1][1]); ctx.lineTo(W+3000,pl.dir<0?-4000:H+4000); ctx.lineTo(-3000,pl.dir<0?-4000:H+4000); ctx.closePath(); ctx.clip();
        ctx.drawImage(oc,0,0); // lit edge
        ctx.strokeStyle='rgba(255,236,220,.85)'; ctx.lineWidth=4; ctx.beginPath(); sp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
        ctx.restore(); track('pl'+pl.dir,apex[0]+pl.dx,apex[1]+pl.dy); }
    }
  }
  // fade from black at the start, flash on NÃO, end fade
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  const blk=Math.max(1-ssstep(0.05,1.5,t), ssstep(64.35,65.0,t));
  if(blk>0){ ctx.fillStyle=`rgba(0,0,0,${blk})`; ctx.fillRect(0,0,W,H); }
  const fl=Math.max(0, (t>=C.nao? Math.exp(-14*(t-C.nao)):0)*0.35, (t>=45.02? Math.exp(-10*(t-45.02)):0)*0.28);
  if(fl>0.004){ ctx.fillStyle=`rgba(255,250,240,${fl})`; ctx.fillRect(0,0,W,H); }
  // grain
  if(grainPat){ ctx.save(); const f=Math.floor(t*24); const r=OM.rng(f+3); ctx.translate(-r()*512,-r()*512); ctx.globalAlpha=0.07; ctx.globalCompositeOperation='overlay'; ctx.fillStyle=grainPat; ctx.fillRect(0,0,W+512,H+512); ctx.restore(); }
  TR.set('camA',null); TR.delete('camA');
  return {camA,camB};
}
</script>
<script>
let LAST={};
window.__motion=(t0,t1)=>{ const a=draw(t0); const A=TR; const b=draw(t1); let d=0;
  for(const [k,p] of TR){ const q=A.get(k); if(q) d=Math.max(d,Math.hypot(p[0]-q[0],p[1]-q[1])); }
  const cam=(t0+t1)/2; const K=cam<37.0?KA:KB, Hh=cam<37.0?HITS_A:HITS_B;
  d=Math.max(d,OM.screenTravel(camOf(t0,K,Hh),camOf(t1,K,Hh),camOf(cam,K,Hh),{W,H}));
  return Math.min(d,700); };
window.__seek=async t=>{ draw(t); document.getElementById('hud').textContent='t='+t.toFixed(3); return true; };
function mirrorTile(img){ const w=img.width,h=img.height; const c=document.createElement('canvas'); c.width=w*2; c.height=h*2; const x=c.getContext('2d');
  x.drawImage(img,0,0); x.save(); x.translate(w*2,0); x.scale(-1,1); x.drawImage(img,0,0); x.restore();
  x.save(); x.translate(0,h*2); x.scale(1,-1); x.drawImage(c,0,0,w*2,h,0,0,w*2,h); x.restore(); return c; }
const FONTS=["600 50px Oswald","300 50px Oswald","400 50px Yellowtail","italic 800 50px 'Barlow Condensed'","italic 900 50px 'Barlow Condensed'","700 50px 'Barlow Condensed'","500 50px Barlow","400 50px Barlow","600 50px Barlow","400 50px 'Kaushan Script'"];
window.__ready=Promise.all([loadImg('logo','logo.png'),loadImg('maroon','maroon.jpg'),loadImg('grain','grain.png'),...FONTS.map(f=>document.fonts.load(f,'AÃÇÉÍÓ'))]).then(()=>{
  maroonPat=mainCtx.createPattern(mirrorTile(IMG.maroon),'repeat'); grainPat=mainCtx.createPattern(IMG.grain,'repeat'); MC.clear(); draw(0); return true; });
const q=new URLSearchParams(location.search);
if(q.has('hud')) document.getElementById('hud').style.display='block';
if(q.has('t')) __ready.then(()=>window.__seek(parseFloat(q.get('t'))));
</script>
