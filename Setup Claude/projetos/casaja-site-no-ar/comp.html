    if(k>0){ blade(lerp(-1800,0,k),END.y+200,900,lerp(40,170,clamp(th,0,1.4)),SK,NV.y,1,'url2');
      slam('wc','CASADOJA.COM',lerp(-1800,0,k),END.y+250,{...BCI9,size:fitSize('CASADOJA.COM',BCI9,780,140),color:NV.navy},C.end+0.9,t,{dist:120,stagger:0.03}); }
    if(t>=C.end+1.4){ const ty=OM.typeOn(t,C.end+1.4,'PARA JOVENS ADVENTISTAS E CRISTÃOS',{cps:44}); word('tg',ty.str,END.x,END.y+420,{...BC7,size:44,color:NV.ice,ls:0.14}); }
  }
}

// ═══════════ frame ═══════════
function draw(t){
  TR=new Map(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const cam=camOf(t); ground(cam,t); world(t,cam);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  const blk=Math.max(1-ssstep(0.0,0.7,t), ssstep(C.fade,DUR-0.05,t));
  if(blk>0){ ctx.fillStyle=`rgba(0,0,0,${blk})`; ctx.fillRect(0,0,W,H); }
  const fl=Math.max((t>=C.drop? Math.exp(-10*(t-C.drop)):0)*0.32,(t>=C.strike? Math.exp(-14*(t-C.strike)):0)*0.22,(t>=C.noar? Math.exp(-12*(t-C.noar)):0)*0.18);
  if(fl>0.004){ ctx.fillStyle=`rgba(255,250,240,${fl})`; ctx.fillRect(0,0,W,H); }
  if(grainPat){ ctx.save(); const f=Math.floor(t*24); const r=OM.rng(f+3); ctx.translate(-r()*512,-r()*512); ctx.globalAlpha=0.07; ctx.globalCompositeOperation='overlay'; ctx.fillStyle=grainPat; ctx.fillRect(0,0,W+512,H+512); ctx.restore(); }
  return cam;
}
</script>
<script>
window.__motion=(t0,t1)=>{ draw(t0); const A=TR; draw(t1); let d=0;
  for(const [k,p] of TR){ const q=A.get(k); if(q) d=Math.max(d,Math.hypot(p[0]-q[0],p[1]-q[1])); }
  d=Math.max(d,OM.screenTravel(camOf(t0),camOf(t1),camOf((t0+t1)/2),{W,H}));
  return Math.min(d,700); };
window.__seek=async t=>{ draw(t); document.getElementById('hud').textContent='t='+t.toFixed(3); return true; };
const FONTS=["italic 800 50px 'Barlow Condensed'","italic 900 50px 'Barlow Condensed'","700 50px 'Barlow Condensed'","500 50px Barlow","600 50px Barlow","700 50px Barlow","900 50px Barlow","400 50px 'Kaushan Script'"];
window.__ready=Promise.all([loadImg('logo','logo.png'),loadImg('grain','grain.png'),...FONTS.map(f=>document.fonts.load(f,'AÃÇÉÍÓ'))]).then(()=>{
  grainPat=mainCtx.createPattern(IMG.grain,'repeat'); MC.clear(); draw(0); return true; });
const q=new URLSearchParams(location.search);
if(q.has('hud')) document.getElementById('hud').style.display='block';
if(q.has('t')) __ready.then(()=>window.__seek(parseFloat(q.get('t'))));
</script>
