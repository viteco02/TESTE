<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#fff">
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
<script>
function setup(){ createCanvas(800, 500, WEBGL); background('#2368F2'); brush.seed(7);
  brush.fill('#C8FF2E', 90); brush.circle(-180, 0, 120);
  brush.set('marker', '#FFFFFF', 2); brush.line(-300, 150, 300, -150);
  brush.set('HB', '#061A66', 1.6); brush.hatch(8, 40); brush.rect(120, 30, 200, 140, 'center');
  noLoop(); setTimeout(()=>document.title='ok', 800); }
</script></body></html>
