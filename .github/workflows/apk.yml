name: APK Android

on:
  push:
    branches: [gmsl-permutas]
    paths: ['android/**', '.github/workflows/apk.yml', 'manifest.webmanifest']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chave de assinatura
        env:
          KS_PASS: ${{ secrets.GMSL_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_PASS" > /tmp/p
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/gmsl-digital.jks.enc -out android/app/gmsl-digital.jks -pass file:/tmp/p
            rm /tmp/p
            echo "ASSINADO=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo GMSL_KEYSTORE_PASS não configurado: gerando só um APK de teste."
          fi
      - name: Compilar
        working-directory: android
        env:
          KS_PASS: ${{ secrets.GMSL_KEYSTORE_PASS }}
        run: |
          if [ "$ASSINADO" = "1" ]; then gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}; cp app/build/outputs/apk/release/app-release.apk ../gmsl-digital.apk
          else gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }}; cp app/build/outputs/apk/debug/app-debug.apk ../gmsl-digital-teste.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: gmsl-digital*.apk
      - name: Publicar versão
        if: env.ASSINADO == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ github.run_number }}" gmsl-digital.apk \
            --target "${{ github.sha }}" --title "GMSL Digital para Android · versão 1.0.${{ github.run_number }}" \
            --notes "Instale o arquivo gmsl-digital.apk no celular Android. Link fixo da versão mais recente: https://github.com/${{ github.repository }}/releases/latest/download/gmsl-digital.apk" --latest
